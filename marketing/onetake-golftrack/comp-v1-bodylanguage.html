<!DOCTYPE html>
<html lang="de">
<head>

<style>

/* words */
.kw{position:absolute;white-space:nowrap;font-weight:800;letter-spacing:-.035em;line-height:1}

.hp{position:absolute;width:46px;height:46px;border-radius:50%;background:var(--pilld);color:var(--mute2);text-align:center;line-height:46px;font-size:22px;font-weight:600}
.hp.done{background:var(--pill);color:var(--ink)}
.hp.cur{background:var(--gold);color:var(--dark)}
/* ball */
#ball{position:absolute;left:0;top:0;border-radius:50%;overflow:hidden;will-change:transform,width,height}
#ball .g,#ball .w,#ball .d,#ball .k{position:absolute;inset:0;border-radius:50%}
#ball .g{background:radial-gradient(circle at 36% 30%,#f6d978 0%,#d6ac3e 42%,#b88f27 78%,#93701b 100%)}
#ball .w{background:radial-gradient(circle at 38% 32%,#ffffff 0%,#e6f0e7 48%,#cbdccd 100%);opacity:0}
#ball .d{background:radial-gradient(circle,rgba(70,50,10,.26) 0 26%,transparent 30%) 0 0/24% 24%;mix-blend-mode:multiply;opacity:0}

#ball .k:after{content:"";position:absolute;left:36%;top:18%;width:18%;height:40%;border-right:solid var(--dark);border-bottom:solid var(--dark);border-width:0 3px 3px 0;transform:rotate(45deg)}
#shadow{position:absolute;left:0;top:0;border-radius:50%;background:radial-gradient(closest-side,rgba(0,0,0,.55),rgba(0,0,0,0))}
#tile{position:absolute;overflow:hidden}
#tile img{position:absolute;width:420px;height:420px}
#hud{position:absolute;right:14px;bottom:10px;font:22px monospace;color:#f66;display:none}
</style>
</head>
<body>

<script>
// ══════════════════════════════════════════════════════════════════════════════════════════════
// GolfTrack · „Von Anfang bis Ende dabei“ — 60 s, 1080×1920. One gold dot is the whole film:
// the tick of the Lernrunde → the ball on the range → the ball on the round → the ball in the app icon.
// Everything is a pure function of t. Beat grid after the music's drop: B(n) = DROP + n·BEAT.

const W=1080,H=1920,DUR=60,FPS=30;
const BEAT=0.626939, DROP=19.45, B=n=>DROP+n*BEAT;

const {clamp,lerp,seg,sstep,ssstep,ease,spring}=OM;
const $=id=>document.getElementById(id);

function mk(tag,cls,css,html,parent=Wd){ const e=document.createElement(tag); if(cls) e.className=cls; if(css) e.style.cssText=css; if(html!=null) e.innerHTML=html; parent.appendChild(e); return e; }

function blur(el,b){ el.style.filter=b>0.3?`blur(${b.toFixed(1)}px)`:'none'; }
// an element that springs in at tIn and lifts out at tOut
function io(el,t,tIn,tOut,{rise=36,dist=90,zeta=0.62,omega=18}={}){ const i=OM.popIn(t,tIn,{rise,zeta,omega}); const o=tOut!=null?OM.liftOut(t,tOut,{dist}):{op:1,dy:0,s:1,blur:0};
  const vis=t>=tIn-0.001&&(tOut==null||t<tOut+0.25); tf(el,0,i.dy+o.dy,i.s*o.s,vis?i.op*o.op:0); blur(el,o.blur); }
const pad=n=>String(n).padStart(2,'0');

// ────────────────────────────── timeline ──────────────────────────────
const T={
  dot:0.6, w0:[1.0,1.24,1.48], w0out:2.6, glide:[2.75,3.35], prog:3.35, progTxt:3.62, chip:3.9, type:4.12, cps:26, opts:5.62,
  hopD:[6.2,6.6], hopA:[7.1,7.5], ex:7.9, nf:8.2, hopBtn:[9.6,10.0], press:10.0, out1:10.05, toBar:[10.05,10.3],
  hit0:10.35, hitDt:0.29, full:12.15, outCards:12.4, curl:[12.55,13.55], move:[13.5,14.15], pct:14.0, lab1:14.2, lab2:14.36, word1:14.6,
  collapse:[16.0,16.45], fall:[16.55,17.6], grid:17.75, hopDr:[18.1,18.45], hopTee:[18.55,18.85], gridOut:18.75, club:[18.8,19.95],
};
const STRIKE=B(0), LAND=B(5);

// ────────────────────────────── strings (all real: app screens + PlatzreifeQuizData.swift) ──────────────────────────────
const CAT={regeln:['Regeln','#ff6b5e','#3a2420'],scoring:['Wertung','#c9a035','#33301a'],platz:['Platz & Ausrüstung','#f0953a','#33291a']};
const Q0={q:'Was bedeutet die Abkürzung „GIR”?',o:['Green in Regulation – das Grün in der Soll-Schlagzahl treffen','Golf International Rating','General Impact Rule','Green Improvement Rate'],c:0,cat:'platz',
  e:'GIR = Green in Regulation: Das Grün in Par minus 2 Schlägen getroffen (für 2 Putts). Bei Par 4: Grün in Schlag 2.'};
const QB=[
  {q:'Welche Farbe haben Markierungen für AUS (Out of Bounds)?',o:['Weiß','Gelb','Rot','Blau'],c:0,cat:'regeln',n:3},
  {q:'Wie lange darf ein Ball gesucht werden?',o:['5 Minuten','2 Minuten','3 Minuten','Unbegrenzt'],c:2,cat:'regeln',n:6},
  {q:'Was ist ein „Double Bogey”?',o:['1 über Par','2 über Par','3 über Par','Fehlschlag + Bogey'],c:1,cat:'scoring',n:9},
  {q:'Was ist ein „Eagle”?',o:['1 unter Par','2 unter Par','3 unter Par','Hole in One auf Par-3'],c:1,cat:'scoring',n:12},
  {q:'Was ist ein „Albatross” (auch Double Eagle)?',o:['1 unter Par','2 unter Par','3 unter Par','4 unter Par'],c:2,cat:'scoring',n:15},
  {q:'Was ist ein „Birdie”?',o:['2 über Par','1 über Par','1 unter Par','2 unter Par'],c:2,cat:'scoring',n:18},
  {q:'Wie viele Löcher hat ein Standard-Golfplatz?',o:['9','12','18','24'],c:2,cat:'platz',n:20},
];
const HITS=QB.map((_,i)=>T.hit0+i*T.hitDt);
const RANGE_SHOTS=[['Driver',220],['Driver',210],['7 Eisen',139],['7 Eisen',142],['3 Wood',196],['Driver',214]]; // press at B9..B14
const TREND=[['7.9.',168],['21.9.',181],['5.10.',190],['19.10.',204],['2.11.',215]];
const PARS=[4,4,3,5,4,4,3,4,5,4,4,3,5,4,4,3,4,5], SCORES=[3,5,4,6,5,4,4,5,6,5,4,3,6,5,5,4,4,4];   // 72 · 82

// ────────────────────────────── build: words ──────────────────────────────
function kw(text,x,y,size,color='var(--ink)'){ const e=mk('div','kw',`left:${x}px;top:${y}px;font-size:${size}px;color:${color}`);

const w0=kw('Vom ersten Schritt',0,800,62); w0.style.width='1080px'; w0.style.textAlign='center';

const prog=mk('div','card','', ''); prog.id='prog';

const qEl=mk('div','',''); qEl.id='q';

const optEls=[0,1,2,3].map(i=>{ const o=mk('div','opt','',`<div class="L">${'ABCD'[i]}</div><span class="tx"></span><div class="ck"></div>`,opts); o.tx=o.querySelector('.tx'); o.L=o.querySelector('.L'); o.ck=o.querySelector('.ck'); return o; });
const ex=mk('div','',''); ex.id='ex'; ex.innerHTML=`<div class="c"></div><b>Richtig!</b>${Q0.e}`;

const lab1=mk('div','lab','font-size:28px;font-weight:600;letter-spacing:.18em;color:var(--mute)','PRÜFUNGSREIFE');
const lab2=mk('div','lab','font-size:50px;font-weight:700;letter-spacing:-.02em','150 von 150 Fragen sitzen');
const word1=kw('Lernen.',0,1250,150); word1.style.width='1080px'; word1.style.textAlign='center';
const PIN='<svg width="30" height="30" viewBox="0 0 24 24"><path d="M12 2a5 5 0 0 1 2 9.6V19h-4v-7.4A5 5 0 0 1 12 2z" fill="currentColor"/><ellipse cx="12" cy="21" rx="8" ry="2.2" fill="none" stroke="currentColor" stroke-width="2"/></svg>';
function setQuestion(Q,typed=null){
  const c=CAT[Q.cat]; chip.innerHTML=PIN+c[0]; chip.style.color=c[1]; chip.style.background=c[2];
  qEl.innerHTML=typed==null?Q.q:typed;
  optEls.forEach((o,i)=>{ o.tx.textContent=Q.o[i]; });
}
// progress bar → ring (svgF)
const BAR={x0:126,x1:954,y:304}, BL=BAR.x1-BAR.x0, BR=BL/(2*Math.PI), BC=(BAR.x0+BAR.x1)/2;
const ringG=sv('g',{},svgF); const ringTrack=sv('polyline',{fill:'none',stroke:'#2c4838','stroke-linecap':'round','stroke-linejoin':'round'},ringG);
const ringFill=sv('polyline',{fill:'none',stroke:'#c9a035','stroke-linecap':'round','stroke-linejoin':'round'},ringG);
const RING_C={x:540,y:800};

// ────────────────────────────── build: range ──────────────────────────────
const TEE={x:300,y:3650}, GROUND=3700, PXM=10;                     // side view: 10 px per metre
const rangeG=sv('g',{},svgB);
sv('rect',{x:-600,y:GROUND,width:4400,height:900,fill:'url(#grass)'},rangeG);
const defs=sv('defs',{},svgB); const lg=sv('linearGradient',{id:'grass',x1:0,y1:0,x2:0,y2:1},defs); sv('stop',{offset:0,'stop-color':'#173a26'},lg); sv('stop',{offset:1,'stop-color':'#0d2419'},lg);
sv('line',{x1:-600,y1:GROUND,x2:3800,y2:GROUND,stroke:'#2d5a3e','stroke-width':4},rangeG);
for(let k=1;k<=5;k++){ const x=TEE.x+k*50*PXM; sv('line',{x1:x,y1:GROUND,x2:x,y2:GROUND-170,stroke:'#7f948a','stroke-width':5},rangeG);
  sv('rect',{x:x-62,y:GROUND-230,width:124,height:62,rx:12,fill:'#1c4129'},rangeG); const tx=sv('text',{x:x,y:GROUND-188,'text-anchor':'middle',class:'sign'},rangeG); tx.textContent=k*50+' m'; }
sv('rect',{x:TEE.x-5,y:TEE.y+22,width:10,height:GROUND-TEE.y-22,rx:3,fill:'#e7dfc4'},rangeG);
sv('rect',{x:TEE.x-14,y:TEE.y+20,width:28,height:6,rx:3,fill:'#e7dfc4'},rangeG);
const trail=sv('polyline',{fill:'none',stroke:'#c9a035','stroke-width':5,'stroke-dasharray':'2 16','stroke-linecap':'round',opacity:.7},rangeG);
const clubG=sv('g',{},svgF); const shaft=sv('line',{stroke:'#d9d3bf','stroke-width':7,'stroke-linecap':'round'},clubG); const head=sv('rect',{width:64,height:30,rx:9,fill:'#e9e3cf'},clubG);
const CLUB_P={x:TEE.x-20,y:TEE.y-560}, CLUB_L=590;
// club grid
const grid=mk('div','card',''); grid.id='grid'; mk('h3','','', 'Schläger wählen',grid);
const CLUBS=['Driver','3 Wood','5 Wood','3 Eisen','4 Eisen','5 Eisen','6 Eisen','7 Eisen','8 Eisen','9 Eisen','PW','GW','SW','LW'];
const tiles=CLUBS.map((c,i)=>mk('div','tile',`left:${33+(i%4)*205}px;top:${100+Math.floor(i/4)*128}px`,`${c}<small>1×</small>`,grid));
// flying distance counter
const flyc=mk('div','',''); flyc.id='flyc';
// range cards
const RX=2111;
const rstat=mk('div','card',`left:${RX}px;top:2470px;width:898px;height:170px`);
const stats=['Bälle','Schläger','Weitester'].map((l,i)=>mk('div','stat',`left:${i*299}px`,`<b>0</b><span>${l}</span>`,rstat).querySelector('b'));
const rhow=mk('div','card',`left:${RX}px;top:2680px;width:898px;height:470px`); mk('h3','','','Wie weit hast du geschlagen?',rhow);
const rclub=mk('div','','','Driver',rhow); rclub.id='rclub';
[['-5',33],['-1',145],['+1',669],['+5',781]].forEach(([s,x])=>mk('div','rb',`left:${x}px;top:150px`,s,rhow));
const rnum=mk('div','','','220',rhow); rnum.id='rnum'; const rm=mk('div','','','m',rhow); rm.id='rm';
const save=mk('div','','','<svg width="34" height="34" viewBox="0 0 34 34"><circle cx="17" cy="17" r="16" fill="#17240f"/><path d="M17 9v16M9 17h16" stroke="#c9a035" stroke-width="3.4" stroke-linecap="round"/></svg>Schlag speichern',rhow); save.id='save';
const SAVE_C={x:RX+33+416,y:2680+330+51};
const rlist=mk('div','card',`left:${RX}px;top:3190px;width:898px;height:570px`); mk('h3','','','Diese Einheit',rlist);
mk('div','',`position:absolute;right:36px;top:36px;font-size:28px;color:var(--gold);font-weight:600`,'Letzten löschen',rlist);
const rows=RANGE_SHOTS.map(([c,d])=>mk('div','row','',`${c}<b>${d} m</b>`,rlist));
// chart card → becomes the recommendation card on the round
const CH={x:RX,y:2700,w:898,h:600,r:28};
const chart=mk('div','card',''); chart.style.overflow='hidden';
const chIn=mk('div','',`position:absolute;left:0;top:0;width:898px;height:600px`,'',chart);
