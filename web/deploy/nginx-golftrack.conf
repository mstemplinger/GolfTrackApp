# golftrack.app – Reverse Proxy auf den Next.js-Dienst (pm2: golftrack, Port 3200).
# Ablage: /etc/nginx/sites-available/golftrack, verlinkt nach sites-enabled.
server {
    server_name golftrack.app;

    # Platz fuer die Let's-Encrypt-Pruefung, bevor es ein Zertifikat gibt.
    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        proxy_pass http://127.0.0.1:3200;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        proxy_read_timeout 60s;
    }

    # Von Next.js erzeugte Dateien tragen einen Hash im Namen und duerfen lange bleiben.
    location /_next/static/ {
        proxy_pass http://127.0.0.1:3200;
        proxy_set_header Host $host;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    client_max_body_size 2m;

    listen [::]:443 ssl; # managed by Certbot
    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/golftrack.app/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/golftrack.app/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot


}

server {
    if ($host = www.golftrack.app) {
        return 301 https://$host$request_uri;
    } # managed by Certbot


    if ($host = golftrack.app) {
        return 301 https://$host$request_uri;
    } # managed by Certbot


    listen 80;
    listen [::]:80;
    server_name golftrack.app www.golftrack.app;
    return 404; # managed by Certbot




}

# www gehoert derselben Seite – eine Adresse reicht, die andere leitet weiter.
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name www.golftrack.app;

    ssl_certificate /etc/letsencrypt/live/golftrack.app/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/golftrack.app/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    return 301 https://golftrack.app$request_uri;
}
